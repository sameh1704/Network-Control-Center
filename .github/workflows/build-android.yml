name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Validate Dart code
        working-directory: mobile
        run: flutter analyze
      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test
      - name: Prepare Android Gradle wrapper
        run: |
          flutter create --platforms=android --project-name network_control_center --org com.example "$RUNNER_TEMP/ncc-android-wrapper"
          cp "$RUNNER_TEMP/ncc-android-wrapper/android/gradlew" mobile/android/gradlew
          cp "$RUNNER_TEMP/ncc-android-wrapper/android/gradle/wrapper/gradle-wrapper.jar" mobile/android/gradle/wrapper/gradle-wrapper.jar
          chmod +x mobile/android/gradlew
      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Network_Control_Center_V3_APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
