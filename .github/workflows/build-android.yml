name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create --platforms=android --project-name network_control_center app
      - name: Install application source
        run: |
          cp mobile/lib/main.dart app/lib/main.dart
          cp mobile/pubspec.yaml app/pubspec.yaml
          if [ -d mobile/test ]; then rm -rf app/test; mkdir -p app/test; cp mobile/test/*.dart app/test/; fi
          if [ -d mobile/assets ]; then cp -r mobile/assets app/assets; fi
          python3 - <<'PY'
          from pathlib import Path
          f=Path('app/android/app/src/main/AndroidManifest.xml')
          s=f.read_text()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          f.write_text(s)
          PY
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ubuntu-9.3.1
          restore-keys: |
            gradle-ubuntu-

      - name: Prepare Gradle with retry
        working-directory: app
        run: |
          for i in 1 2 3; do
            ./gradlew --version && break
            echo "Gradle preparation failed; retrying in 30 seconds..."
            sleep 30
          done

      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get
      - name: Validate Dart code
        working-directory: app
        run: flutter analyze lib/main.dart
      - name: Run Flutter tests
        working-directory: app
        run: flutter test
      - name: Build release APK
        working-directory: app
        run: flutter build apk --release
      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: NCC_V3_VM_Responsive_UI_Fixed_APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: Verify APK signature
        working-directory: app
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          test -x "$apksigner"
          "$apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
