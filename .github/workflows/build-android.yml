name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project
        run: flutter create --platforms=android --project-name network_control_center app
      - name: Install application source
        run: |
          cp mobile/lib/main.dart app/lib/main.dart
          cp mobile/pubspec.yaml app/pubspec.yaml
          if [ -d mobile/test ]; then rm -rf app/test; mkdir -p app/test; cp mobile/test/*.dart app/test/; fi
          if [ -d mobile/assets ]; then cp -r mobile/assets app/assets; fi
          python3 - <<'PY'
          from pathlib import Path
          f=Path('app/android/app/src/main/AndroidManifest.xml')
          s=f.read_text()
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          f.write_text(s)
          PY
      - name: Use Gradle services mirror
        working-directory: app
        run: python3 -c "import pathlib; p=pathlib.Path('android/gradle/wrapper/gradle-wrapper.properties'); lines=p.read_text().splitlines(); lines=['distributionUrl=https://services.gradle.org/distributions/gradle-9.3.1-all.zip' if x.startswith('distributionUrl=') else x for x in lines]; p.write_text(chr(10).join(lines)+chr(10))"

      - name: Show Gradle wrapper URL
        working-directory: app
        run: cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper 
      - name: Fetch dependencies
        working-directory: app
        run: flutter pub get
      - name: Validate Dart code
        working-directory: app
        run: flutter analyze lib/main.dart
      - name: Run Flutter tests
        working-directory: app
        run: flutter test
      - name: Build release APK with retries
        working-directory: app
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              if [ "$attempt" -eq 2 ]; then sleep 20; else sleep 45; fi
            fi
            echo "Build attempt $attempt"
            if flutter build apk --release 2>&1 | tee "build-attempt-$attempt.log"; then
              exit 0
            fi
            if grep -Eiq 'HTTP response code: 50[234]|Gateway Time-out|Connection (reset|timed out)|Could not (GET|download)|SocketTimeout|Temporary failure' "build-attempt-$attempt.log"; then
              echo "Transient network failure detected; retrying..."
              continue
            fi
            echo "Non-transient build failure; stopping."
            exit 1
          done
          exit 1
      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: NCC_V3_VM_Responsive_UI_Fixed_APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - name: Verify APK signature
        working-directory: app
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          test -x "$apksigner"
          "$apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
